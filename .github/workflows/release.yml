name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Determine release version
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            $ver = $tag.TrimStart("v")
          } else {
            $ver = "${{ github.event.inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.1.0" }
            $tag = "v$ver"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Setup.exe with Inno Setup
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=${{ steps.meta.outputs.version }}" "installer\scyrox-v6-control.iss"

      - name: Package portable ZIP and SHA256SUMS
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $stage = "dist\portable\ScyroxV6Control-$ver-win64"
          New-Item -ItemType Directory -Force -Path "$stage\config" | Out-Null
          Copy-Item "target\release\scyrox-v6-control.exe" "$stage\"
          Copy-Item "config\scyrox_v6_map.json" "$stage\config\"
          Copy-Item "README.md", "LICENSE" "$stage\"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\ScyroxV6Control-$ver-win64-portable.zip" -Force

          Get-FileHash "dist\ScyroxV6Control-$ver-Setup.exe", "dist\ScyroxV6Control-$ver-win64-portable.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii "dist\SHA256SUMS.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScyroxV6Control-win64-${{ steps.meta.outputs.version }}
          path: |
            dist\ScyroxV6Control-*.exe
            dist\ScyroxV6Control-*-portable.zip
            dist\SHA256SUMS.txt

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          gh release create "$tag" `
            "dist\ScyroxV6Control-$ver-Setup.exe" `
            "dist\ScyroxV6Control-$ver-win64-portable.zip" `
            "dist\SHA256SUMS.txt" `
            --title "Scyrox V6 Control $tag" `
            --generate-notes
